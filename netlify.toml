# Netlify configuration.
#
# Only dist/ is published. The build copies the site into it, file by file,
# so nothing that is not the site (source, docs, planning documents, the
# secrets file on a laptop) can ever become a public URL. See
# web/scripts/build-dist.mjs.
#
# `npm run build` produces the browser pricing bundle and the Node pricing
# bundle the payment functions import, so a deploy can never ship a funnel
# and a server that disagree about price.

[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

  # js/config.js is the one file that is SUPPOSED to contain keys, and it is
  # generated at build time from the variables below rather than committed.
  #
  # Two different checks fire on it, so both need answering.
  #
  # OMIT_KEYS says these particular variables are meant to reach the browser.
  # Every one of them is public by design and useless without its restriction:
  # a Google browser key locked to 513autoclean.com, a Stripe PUBLISHABLE key
  # that can authorize nothing, a PayPal client id, a Turnstile site key.
  # Without this, the scanner correctly objects to an environment variable's
  # value appearing in build output.
  #
  # OMIT_PATHS answers smart detection, which recognises the `AIza...` shape
  # wherever it sees it.
  #
  # Both are deliberately narrow. The scanner keeps its real job: catching the
  # day an sk_live_ key, a service account JSON or the iCloud calendar URL
  # lands in the repo. SECRETS_SCAN_SMART_DETECTION_ENABLED = false would
  # clear the same error by giving that up entirely.
  SECRETS_SCAN_OMIT_KEYS = "STRIPE_PUBLISHABLE_KEY,GOOGLE_CALENDAR_API_KEY,GOOGLE_PLACES_API_KEY,GOOGLE_API_KEY,PAYPAL_CLIENT_ID,TURNSTILE_SITE_KEY,GOOGLE_CALENDAR_ID"
  SECRETS_SCAN_OMIT_PATHS = "js/config.js,dist/js/config.js"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Lighthouse, on every build
# ---------------------------------------------------------------------------
#
# Scores and the full report land in the Netlify UI and in the deploy log,
# and on a pull request they appear in the deploy preview comment. Netlify
# installs the plugin itself from this block; there is nothing to add to
# package.json.
#
# WHY THREE PATHS. The home page carries the funnel and is what the money
# depends on. The two legal pages are plain documents with no scripts, so if
# their scores ever drop it is the shared head that did it, which makes them
# a useful control against the home page.
#
# Paths are relative to the publish directory, which is dist/.
#
# NO THRESHOLDS ON PURPOSE. The plugin can fail a build when a score falls
# below a number, and a performance score moves with the CPU Netlify happens
# to give the runner. A booking fix that cannot deploy because a synthetic
# audit came in at 0.78 on a noisy machine is a worse problem than a slow
# page. Read the number, act on it, do not let it hold the site hostage.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    output_path = "reports/lighthouse.html"

  [[plugins.inputs.audits]]
    path = "index.html"
    output_path = "reports/lighthouse-home.html"

  [[plugins.inputs.audits]]
    path = "terms.html"
    output_path = "reports/lighthouse-terms.html"

  [[plugins.inputs.audits]]
    path = "privacy.html"
    output_path = "reports/lighthouse-privacy.html"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------

# The old booking page is a section of the home page now.
[[redirects]]
  from = "/book.html"
  to = "/#book"
  status = 301

[[redirects]]
  from = "/book"
  to = "/#book"
  status = 301

# Friendlier URLs for the API.
[[redirects]]
  from = "/api/reviews"
  to = "/.netlify/functions/reviews"
  status = 200

[[redirects]]
  from = "/api/personal-busy"
  to = "/.netlify/functions/personal-busy"
  status = 200

[[redirects]]
  from = "/api/travel"
  to = "/.netlify/functions/travel"
  status = 200

[[redirects]]
  from = "/api/create-payment"
  to = "/.netlify/functions/create-payment"
  status = 200

[[redirects]]
  from = "/api/paypal-order"
  to = "/.netlify/functions/paypal-order"
  status = 200

[[redirects]]
  from = "/api/send-confirmation"
  to = "/.netlify/functions/send-confirmation"
  status = 200

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(self \"https://js.stripe.com\" \"https://www.paypal.com\"), usb=(), interest-cohort=()"
    # Report-only first. Every origin below is one the page actually talks
    # to; the inline scripts were moved into js/ so 'unsafe-inline' is not
    # needed for scripts. Styles keep it because Leaflet and the funnel set
    # style attributes from JavaScript. Promote to enforcing once the
    # console is quiet on a real booking end to end.
    #
    # BEFORE PROMOTING THIS TO ENFORCING, check Real User Monitoring. Netlify
    # injects its own script before </body> on production deploys, after this
    # file has had its say, so a script-src that does not admit it would stop
    # the measurement and leave the dashboard empty with nothing to explain
    # why. Report-only means it cannot break anything today: watch the
    # violation reports from a production visit, then widen this to match
    # what RUM actually asks for, or switch RUM off. The privacy policy
    # describes it either way, through the performanceMonitoring switch in
    # web/lib/site/capabilities.ts.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://js.stripe.com https://www.paypal.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://*.googleusercontent.com https://lh3.googleusercontent.com https://*.paypal.com https://*.paypalobjects.com; connect-src 'self' https://api.web3forms.com https://nominatim.openstreetmap.org https://places.googleapis.com https://www.googleapis.com https://api.stripe.com https://*.paypal.com https://challenges.cloudflare.com; frame-src https://js.stripe.com https://hooks.stripe.com https://www.paypal.com https://*.paypal.com https://challenges.cloudflare.com; base-uri 'self'; form-action 'self' https://api.web3forms.com; object-src 'none'; frame-ancestors 'self'"

# Every asset URL carries a content hash (?v=...), so it can be cached hard.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
